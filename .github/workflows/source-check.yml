# Diagnostic: shows what each external value source returns from GitHub's
# network (status, response shape, sample rows). Run manually from Actions.
name: Source check

on:
  workflow_dispatch:
    inputs:
      player:
        description: Optional player name to inspect (e.g. Jaxson Dart)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-sources.ts
        env:
          PLAYER: ${{ inputs.player }}
